# Release builds for GitHub, run by .github/workflows/release.yml on a v* tag.
# The same binaries can be built locally with "make dist".
version: 2

project_name: sshm

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # The tag, with its "v": the version string is shown as-is everywhere.
      - -X github.com/master2sid2/sshm/internal/version.Version={{ .Tag }}
    goos: [linux, darwin] # Windows is not supported
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS

# The release notes come from docs/releases/<tag>.md (see release.yml);
# do not disable the changelog pipe: it is also what applies --release-notes.

release:
  footer: |
    ### Install
    Download the binary for your platform, check it against `SHA256SUMS`, make it executable and put it on your `PATH`, or run `go install github.com/master2sid2/sshm@{{ .Tag }}`.
